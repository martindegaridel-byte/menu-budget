<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hors connexion · Popote</title>
<script>(function(){var d=document.documentElement;try{var t=localStorage.getItem("mb:theme");if(t==="auto")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";d.dataset.theme=t==="light"?"light":"dark"}catch(e){}})();</script>
<style>
  :root { color-scheme: dark; --canvas:#15110f; --surface:#1e1916; --fg:#f4ece0; --muted:#bcae9f; --line:rgba(244,236,224,.14); --accent:#f0603f; --accent-fg:#2b0b04; --accent-text:#ff9c84; --focus:#ffb347; }
  :root[data-theme="light"] { color-scheme: light; --canvas:#f6efe3; --surface:#fffaf3; --fg:#241c16; --muted:#5a4c40; --line:rgba(36,28,22,.2); --accent:#b93d26; --accent-fg:#fff; --accent-text:#a3351e; --focus:#b93d26; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--canvas); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 26rem; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 22px; text-align: center; }
  svg { width: 40px; height: 40px; color: var(--accent-text); }
  h1 { font-family: Fraunces, Georgia, "Times New Roman", serif; font-weight: 600; font-size: 1.6rem; line-height: 1.2; margin: 14px 0 8px; }
  p { color: var(--muted); margin: 0 0 22px; }
  a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 12px; background: var(--accent); color: var(--accent-fg); font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
</style>
</head>

</html>
